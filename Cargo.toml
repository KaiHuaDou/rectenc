[package]
name = "rectenc"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
opencv = { version = "0.98.1" }
rayon = { version = "1.11.0"}
rmp-serde = { version = "1.3.1" }
serde = { version = "1.0.228", features = ["derive"] }

[profile.release]
lto = true
panic = 'abort'
incremental = false
codegen-units = 1
